<!doctype html><html><head><meta charset='utf-8'><title>Emote crate: templates</title><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='preconnect' href='https://fonts.googleapis.com'><link href='https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Source+Sans+3:wght@600;700&display=block' rel='stylesheet'><link rel='stylesheet' href='kit.css'><link id='preset' rel='stylesheet' href='styles/stud.css'></head><body><div id='wrap'><div id='stage' style='height:1080px'><div class='abs fill' style='background:linear-gradient(#1d3a33,#142620)'></div><div class='cap' style='left:60px;top:30px'>Runtime templates: one reel tile per rarity (the runtime clones these into the reel and the reveal)</div><div class='abs fill grp' data-g='Tile_common' data-a='TL' style='pointer-events:none'><div class='abs tile' data-n='Tile_common' style='left:60px;top:110px;width:190px;height:190px;border:7px solid #9aa2a9;border-radius:20px;background:linear-gradient(#eef1f4,#9aa2a9);box-shadow:0 0 0 4px #070a0e;'><img class='ic' src='icons/emote_slot.png' data-n='Icon' style='left:36px;top:13px;width:117px;height:117px;'><div class='abs' style='left:8px;right:8px;bottom:10px;text-align:center'><span class='ot s ' data-t='Wave' data-n='EmoteName' style='font-size:26px;'>Wave</span></div><div class='abs fill hid' data-n='Shade' style='background:rgba(4,8,12,.62)'></div></div></div><div class='abs fill grp' data-g='Tile_rare' data-a='TL' style='pointer-events:none'><div class='abs tile' data-n='Tile_rare' style='left:320px;top:110px;width:190px;height:190px;border:7px solid #2fa8ff;border-radius:20px;background:linear-gradient(#bfe6ff,#2a7fd6);box-shadow:0 0 0 4px #070a0e;'><img class='ic' src='icons/emote_slot.png' data-n='Icon' style='left:36px;top:13px;width:117px;height:117px;'><div class='abs' style='left:8px;right:8px;bottom:10px;text-align:center'><span class='ot s ' data-t='Robot' data-n='EmoteName' style='font-size:26px;'>Robot</span></div><div class='abs fill hid' data-n='Shade' style='background:rgba(4,8,12,.62)'></div></div></div><div class='abs fill grp' data-g='Tile_epic' data-a='TL' style='pointer-events:none'><div class='abs tile' data-n='Tile_epic' style='left:580px;top:110px;width:190px;height:190px;border:7px solid #b44dff;border-radius:20px;background:linear-gradient(#efc8ff,#8a2fd8);box-shadow:0 0 0 4px #070a0e;'><img class='ic' src='icons/emote_slot.png' data-n='Icon' style='left:36px;top:13px;width:117px;height:117px;'><div class='abs' style='left:8px;right:8px;bottom:10px;text-align:center'><span class='ot s ' data-t='Moonwalk' data-n='EmoteName' style='font-size:26px;'>Moonwalk</span></div><div class='abs fill hid' data-n='Shade' style='background:rgba(4,8,12,.62)'></div></div></div><div class='abs fill grp' data-g='Tile_legendary' data-a='TL' style='pointer-events:none'><div class='abs tile' data-n='Tile_legendary' style='left:840px;top:110px;width:190px;height:190px;border:7px solid #ffc21c;border-radius:20px;background:linear-gradient(#fff3b8,#f0a000);box-shadow:0 0 0 4px #070a0e;'><img class='ic' src='icons/emote_slot.png' data-n='Icon' style='left:36px;top:13px;width:117px;height:117px;'><div class='abs' style='left:8px;right:8px;bottom:10px;text-align:center'><span class='ot s ' data-t='Golden Strut' data-n='EmoteName' style='font-size:26px;'>Golden Strut</span></div><div class='abs fill hid' data-n='Shade' style='background:rgba(4,8,12,.62)'></div></div></div></div></div>
<script>
const q = new URLSearchParams(location.search);
if(q.get('style')) document.getElementById('preset').href='styles/'+q.get('style')+'.css';
function fit(){ const w=document.getElementById('wrap');
  if(q.has('raw')){ w.style.transform='none'; return; }
  const H=document.getElementById('stage').offsetHeight;
  const s=Math.min(innerWidth/1920, innerHeight/H); w.style.transform='scale('+s+')';
  w.style.left=((innerWidth-1920*s)/2)+'px'; w.style.top=((innerHeight-H*s)/2)+'px'; }
addEventListener('resize', fit); fit();
// autofit: an outlined label wider than its plate/tile/panel is squeezed (scaleX to .8, then font-size)
function autofit(){
  document.querySelectorAll('.ot').forEach(e=>{
    const c=e.closest('.plate,.tile,.inset,.panel,.glass'); if(!c) return;
    const cs=getComputedStyle(e.parentElement);
    const cr=c.getBoundingClientRect(), er=e.getBoundingClientRect(), k=cr.width/c.offsetWidth||1, pad=(c.classList.contains('plate')?14:8)*k;
    let avail, origin='left';
    if(cs.textAlign==='center'||cs.justifyContent==='center'){ avail=Math.min(e.parentElement.getBoundingClientRect().width, cr.width)-2*pad; origin='center'; }
    else if(cs.textAlign==='right'||cs.justifyContent==='flex-end'){ avail=er.right-cr.left-pad; origin='right'; }
    else { avail=cr.right-pad-er.left; }
    if(er.width<=avail) return;
    let sc=avail/er.width;
    if(sc<.8){ const fs=parseFloat(getComputedStyle(e).fontSize); e.style.fontSize=(fs*sc/.8)+'px'; sc=.8; }
    e.style.transform='scaleX('+sc.toFixed(3)+')'; e.style.transformOrigin=origin+' center';
  });
}
document.fonts.ready.then(autofit);
// ?check: outline text that spills out of its box + list broken images (also callable from devtools)
window.checkOverflow = function(){
  const bad=[]; const st=document.getElementById('stage').getBoundingClientRect();
  document.querySelectorAll('.ot').forEach(e=>{
    const r=e.getBoundingClientRect(); const c=e.closest('.plate,.tile,.inset,.panel,.glass');
    const k=(r.width/e.offsetWidth)||1;
    if(c){ const b=c.getBoundingClientRect();
      if(r.left<b.left-3*k||r.right>b.right+3*k||r.top<b.top-12*k||r.bottom>b.bottom+12*k){bad.push(e.dataset.t); e.classList.add('overflowing');} }
    if(r.right>st.right+1||r.left<st.left-1||r.bottom>st.bottom+1){ bad.push('STAGE:'+e.dataset.t); e.classList.add('overflowing'); }
  });
  const broken=[...document.images].filter(i=>i.complete && !i.naturalWidth).map(i=>i.getAttribute('src'));
  return {overflow:bad, broken};
};
if(q.has('check')) document.fonts.ready.then(()=>setTimeout(()=>console.log(JSON.stringify(checkOverflow())), 300));
</script></body></html>
